appId: dev.synapse.editor
productName: Synapse
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: ToguDV <ToguDV@users.noreply.github.com>
  synopsis: Notion-style block editor
  description: Offline-first block editor with local SQLite storage.
  syncDesktopName: true
deb:
  packageName: synapse-untitled
